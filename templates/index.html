<!DOCTYPE html>
<html>
<head>
    <title>Calf Weight Estimator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 32px; }
        .upload-area {
            border: 2px dashed #ccc; border-radius: 12px; padding: 40px;
            text-align: center; background: white; cursor: pointer;
            transition: border-color 0.2s;
        }
        .upload-area:hover { border-color: #333; }
        .upload-area.dragover { border-color: #2563eb; background: #eff6ff; }
        input[type=file] { display: none; }
        .fields { display: flex; gap: 12px; margin-top: 16px; }
        .fields input {
            flex: 1; padding: 10px 14px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px;
        }
        button {
            width: 100%; padding: 14px; margin-top: 16px; background: #111;
            color: white; border: none; border-radius: 8px; font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #333; }
        button:disabled { background: #999; cursor: not-allowed; }
        .result {
            margin-top: 24px; padding: 24px; background: white;
            border-radius: 12px; text-align: center;
        }
        .weight { font-size: 48px; font-weight: bold; }
        .weight-unit { font-size: 24px; color: #666; }
        .confidence { color: #666; margin-top: 8px; }
        .preview { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 16px; }
        .error { color: #dc2626; margin-top: 16px; }
        .loading { display: none; margin-top: 16px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <h1>Calf Weight Estimator</h1>
    <p class="subtitle">Upload a photo of a calf to estimate its weight</p>

    <form id="form" enctype="multipart/form-data">
        <div class="upload-area" id="dropzone" onclick="document.getElementById('file').click()">
            <p>Click or drag a photo here</p>
            <input type="file" id="file" name="file" accept="image/*">
        </div>

        <img id="preview" class="preview" style="display:none" alt="Preview">

        <div class="fields">
            <input type="number" name="hip_height_cm" placeholder="Hip height (cm) — optional">
            <input type="number" name="age_days" placeholder="Age (days) — optional">
        </div>

        <button type="submit" id="btn">Estimate Weight</button>
        <p class="loading" id="loading">Processing...</p>
    </form>

    <div id="result"></div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const form = document.getElementById('form');
const btn = document.getElementById('btn');
const loading = document.getElementById('loading');
const resultDiv = document.getElementById('result');

['dragenter','dragover'].forEach(function(e) {
    dropzone.addEventListener(e, function(ev) {
        ev.preventDefault();
        dropzone.classList.add('dragover');
    });
});
['dragleave','drop'].forEach(function(e) {
    dropzone.addEventListener(e, function(ev) {
        ev.preventDefault();
        dropzone.classList.remove('dragover');
    });
});
dropzone.addEventListener('drop', function(ev) {
    fileInput.files = ev.dataTransfer.files;
    showPreview();
});
fileInput.addEventListener('change', showPreview);

function showPreview() {
    if (fileInput.files[0]) {
        var url = URL.createObjectURL(fileInput.files[0]);
        preview.src = url;
        preview.style.display = 'block';
        dropzone.style.display = 'none';
    }
}

form.addEventListener('submit', function(e) {
    e.preventDefault();
    btn.disabled = true;
    loading.style.display = 'block';
    resultDiv.textContent = '';

    var formData = new FormData(form);

    fetch('/predict', { method: 'POST', body: formData })
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            if (data.error) {
                var errorEl = document.createElement('p');
                errorEl.className = 'error';
                errorEl.textContent = data.error;
                resultDiv.appendChild(errorEl);
            } else {
                var container = document.createElement('div');
                container.className = 'result';

                var weightEl = document.createElement('div');
                weightEl.className = 'weight';
                weightEl.textContent = data.weight_kg;
                var unitEl = document.createElement('span');
                unitEl.className = 'weight-unit';
                unitEl.textContent = ' kg';
                weightEl.appendChild(unitEl);

                var confEl = document.createElement('p');
                confEl.className = 'confidence';
                confEl.textContent = 'Detection: ' + data.detection;

                container.appendChild(weightEl);
                container.appendChild(confEl);
                resultDiv.appendChild(container);
            }
            btn.disabled = false;
            loading.style.display = 'none';
        })
        .catch(function(err) {
            var errorEl = document.createElement('p');
            errorEl.className = 'error';
            errorEl.textContent = 'Error: ' + err.message;
            resultDiv.appendChild(errorEl);
            btn.disabled = false;
            loading.style.display = 'none';
        });
});
</script>
</body>
</html>
